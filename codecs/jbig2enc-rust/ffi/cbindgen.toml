# Generates include/jbig2rs.h. The header is checked in so C consumers need no
# Rust toolchain, and `tests/header.rs` fails when it drifts from src/lib.rs.
# Regenerate with:
#   JBIG2RS_BLESS_HEADER=1 cargo test -p jbig2enc-ffi --test header
language = "C"
header = """
/*
 * jbig2rs.h -- C ABI for the jbig2enc-rust JBIG2 encoder and decoder.
 *
 * GENERATED by cbindgen from src/lib.rs. Do not edit by hand.
 *
 * Ownership: everything the library allocates is freed by the matching
 * jbig2rs_*_free function, never by free(). Errors: every function that can
 * fail returns a JBIG2RS_* status (0 = success) and records a message for
 * jbig2rs_last_error_message() on the calling thread.
 *
 * Licence: MIT AND Apache-2.0. A binary build includes Apache-2.0 code;
 * distribute the NOTICE file with it.
 */"""
include_guard = "JBIG2RS_H"
cpp_compat = true
documentation_style = "doxy"
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true

[export]
prefix = ""

[parse]
parse_deps = false
